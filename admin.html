<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel de Administración · Patitas de Lana</title>
  <style>
    :root {
      --bg: #fdf7f2;
      --card: #ffffff;
      --text: #3d2c2e;
      --muted: #8a7376;
      --accent: #c97b84;
      --accent-dark: #a85f68;
      --border: #f0e2dc;
      --error: #c0392b;
      --success: #2e7d5b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .panel {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 12px 32px rgba(61, 44, 46, 0.08);
    }

    .panel h1 {
      margin: 0 0 4px;
      font-size: 1.4rem;
      text-align: center;
    }

    .panel .subtitle {
      margin: 0 0 24px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .field label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
    }

    .field input {
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      background: #fffdfb;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(201, 123, 132, 0.15);
    }

    .field input[type="file"] {
      padding: 9px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    button:hover:not(:disabled) { background: var(--accent-dark); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .message {
      margin-top: 14px;
      font-size: 0.85rem;
      text-align: center;
      min-height: 1.2em;
    }

    .message.error { color: var(--error); }
    .message.success { color: var(--success); }

    .hidden { display: none !important; }

    .logout-btn {
      margin-top: 20px;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .logout-btn:hover:not(:disabled) {
      background: #faf1ec;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="panel">
    <!-- Login -->
    <section id="loginSection">
      <h1>Patitas de Lana</h1>
      <p class="subtitle">Panel de administración</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <button type="submit" id="loginBtn">Iniciar Sesión</button>
        <p class="message" id="loginMessage" role="status"></p>
      </form>
    </section>

    <!-- Panel de productos -->
    <section id="adminSection" class="hidden">
      <h1>Agregar Nuevo Amigurumi</h1>
      <p class="subtitle">Completa los datos y publica el producto</p>

      <form id="productForm" novalidate>
        <div class="field">
          <label for="productName">Nombre</label>
          <input type="text" id="productName" name="productName" required />
        </div>
        <div class="field">
          <label for="productPrice">Precio (CLP)</label>
          <input type="number" id="productPrice" name="productPrice" min="0" step="1" required />
        </div>
        <div class="field">
          <label for="productImage">Foto</label>
          <input type="file" id="productImage" name="productImage" accept="image/*" required />
        </div>
        <button type="submit" id="publishBtn">Publicar producto</button>
        <p class="message" id="productMessage" role="status"></p>
      </form>

      <button type="button" id="logoutBtn" class="logout-btn">Cerrar sesión</button>
    </section>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
